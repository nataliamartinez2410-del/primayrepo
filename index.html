<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111827" />
  <title>Mis Tareas | Organizador diario</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">ORGANIZADOR DIARIO</p>
        <h1>Mis tareas</h1>
        <p id="today" class="muted"></p>
      </div>
      <button id="clearCompleted" class="ghost-btn" type="button">Limpiar completadas</button>
    </header>

    <section class="stats" aria-label="Resumen">
      <article><span id="totalCount">0</span><small>Total</small></article>
      <article><span id="pendingCount">0</span><small>Pendientes</small></article>
      <article><span id="doneCount">0</span><small>Completadas</small></article>
      <article><span id="highCount">0</span><small>Prioridad alta</small></article>
    </section>

    <section class="card composer">
      <form id="taskForm">
        <input id="taskInput" required maxlength="120" placeholder="¿Qué necesitas hacer hoy?" autocomplete="off" />
        <select id="priorityInput" aria-label="Prioridad">
          <option value="normal">Normal</option>
          <option value="alta">Alta</option>
          <option value="baja">Baja</option>
        </select>
        <select id="categoryInput" aria-label="Categoría">
          <option value="Personal">Personal</option>
          <option value="Trabajo">Trabajo</option>
          <option value="Estudio">Estudio</option>
          <option value="Casa">Casa</option>
          <option value="Otro">Otro</option>
        </select>
        <input id="dateInput" type="date" aria-label="Fecha" />
        <button class="primary-btn" type="submit">+ Agregar tarea</button>
      </form>
    </section>

    <section class="toolbar card">
      <div class="filters" role="group" aria-label="Filtros">
        <button class="filter active" data-filter="all">Todas</button>
        <button class="filter" data-filter="pending">Pendientes</button>
        <button class="filter" data-filter="done">Completadas</button>
      </div>
      <input id="searchInput" class="search" placeholder="Buscar tarea..." aria-label="Buscar tarea" />
    </section>

    <section id="taskList" class="task-list" aria-live="polite"></section>
    <div id="emptyState" class="empty card hidden">
      <div class="empty-icon">✓</div>
      <h2>Todo en orden</h2>
      <p>No hay tareas que coincidan con este filtro.</p>
    </div>

    <footer>Los datos se guardan automáticamente en este dispositivo.</footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
